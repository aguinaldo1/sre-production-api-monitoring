groups:
  - name: reliability-api
    rules:
      - alert: ReliabilityApiDown
        expr: up{job="reliability-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: reliability-api
        annotations:
          summary: "Reliability API is unavailable"
          description: "Prometheus has been unable to scrape the Reliability API for at least 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            100 *
            sum(increase(http_server_requests_seconds_count{
              job="reliability-api",
              status=~"5..",
              uri!~"/actuator.*"
            }[5m]))
            /
            sum(increase(http_server_requests_seconds_count{
              job="reliability-api",
              uri!~"/actuator.*"
            }[5m]))
          ) > 10
          and
          (
            sum(increase(http_server_requests_seconds_count{
              job="reliability-api",
              uri!~"/actuator.*"
            }[5m])) >= 20
          )
        for: 1m
        labels:
          severity: warning
          service: reliability-api
        annotations:
          summary: "Reliability API has a high HTTP error rate"
          description: "More than 10% of recent HTTP requests are returning 5xx responses with at least 20 requests in the last 5 minutes."
      - alert: HighLatency
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_requests_seconds_bucket{
                  job="reliability-api",
                  uri!~"/actuator.*"
                }[5m])
              )
            )
          ) > 0.5
          and
          (
            sum(increase(http_server_requests_seconds_count{
              job="reliability-api",
              uri!~"/actuator.*"
            }[5m])) >= 20
          )
        for: 1m
        labels:
          severity: warning
          service: reliability-api
        annotations:
          summary: "Reliability API has high HTTP latency"
          description: "The HTTP request p95 latency has exceeded 500 ms with at least 20 requests in the last 5 minutes."
